<header class="header">
    <nav class="site-nav">
        <button id="menu-toggle" class="hamburger" style="display: block !important; cursor: pointer; background: none; border: none; padding: 0.5rem;">
            <span class="bar" style="background-color: var(--text); display: block; height: 2px; margin: 3px auto; width: 16px;"></span>
            <span class="bar" style="background-color: var(--text); display: block; height: 2px; margin: 3px auto; width: 16px;"></span>
            <span class="bar" style="background-color: var(--text); display: block; height: 2px; margin: 3px auto; width: 16px;"></span>
            <span class="screen-reader-text">Menu</span>
        </button>
        <h1 class="site-title"><a href="/">{{#blog.avatar}}<img id="avatar" class="u-photo" src="{{blog.avatar}}" width="36" height="36" />{{/blog.avatar}}{{blog.title}}</a></h1>
    </nav>
</header>
<div id="toggle-sidebar" style="position: fixed; top: 0; left: 0; width: 300px; height: 100vh; background: var(--background); z-index: 1000; transform: translateX(-100%); transition: transform 0.3s ease; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1);">
    <button id="menu-close">
        <span class="screen-reader-text">Close Menu</span>
    </button>
    <nav id="site-navigation" class="main-navigation">
        <div class="menu-wrapper">
            <ul class="nav-menu">
            {{#blog.menu}}
                <li class="nav-item"><a href="{{url}}">{{{label}}}</a></li>
            {{/blog.menu}}
            </ul>
        </div>
    </nav>
</div>

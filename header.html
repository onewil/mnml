<header class="header">
    <nav class="site-nav">
        <button id="menu-toggle" class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="screen-reader-text">Menu</span>
        </button>
        <h1 class="site-title"><a href="/">{{#blog.avatar}}<img id="avatar" class="u-photo" src="{{blog.avatar}}" width="36" height="36" />{{/blog.avatar}}{{blog.title}}</a></h1>
    </nav>
</header>
<div id="toggle-sidebar">
    <button id="menu-close">
        <span class="screen-reader-text">Close Menu</span>
    </button>
    <nav id="site-navigation" class="main-navigation">
        <div class="menu-wrapper">
            <ul class="nav-menu">
            {{#blog.menu}}
                <li class="nav-item"><a href="{{url}}">{{{label}}}</a></li>
            {{/blog.menu}}
            </ul>
        </div>
    </nav>
</div>

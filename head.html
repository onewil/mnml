<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="view-transition" content="same-origin" />
  <title>{{#entry}}{{#title}}{{{title}}} | {{/title}}{{/entry}}{{blog.title}}</title>
  <link rel="preload" href="/fonts/GT-W-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
  <link rel="preload" href="/fonts/GT-W-Regular-Oblique.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
  <link rel="preload" href="/fonts/GT-W-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
  <link rel="preload" href="/fonts/GT-W-Bold-Oblique.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
  <meta property="og:title" content="{{#entry}}{{{title}}}{{/entry}}{{^entry}}{{blog.title}}{{/entry}}">
  <meta name="twitter:title" content="{{#entry}}{{{title}}}{{/entry}}{{^entry}}{{blog.title}}{{/entry}}">
  <meta name="twitter:card" content="summary">
  <meta name="description" content="{{#entry}}{{body}}{{/entry}}{{^entry}}{{blog.description}}{{/entry}}">
  <meta property="og:description" content="{{#entry}}{{body}}{{/entry}}{{^entry}}{{blog.description}}{{/entry}}">
  <meta name="twitter:description" content="{{#entry}}{{body}}{{/entry}}{{^entry}}{{blog.description}}{{/entry}}">
  {{#entry.thumbnail.large}}
  <meta property="og:image" content="{{url}}">
  {{/entry.thumbnail.large}}
  <link rel="canonical" href="{{#entry}}{{url}}{{/entry}}{{^entry}}{{blog.url}}{{/entry}}">
  <link rel="author" href="humans.txt" />
  <link href="/css/fonts.css" rel="preload stylesheet" as="style">
  <link href="/css/main.css" rel="preload stylesheet" as="style">
  <link href="/css/photos-grid.css" rel="preload stylesheet" as="style">
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#20232a" media="(prefers-color-scheme: dark)" />
</head>

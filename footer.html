<script>
// Sidebar menu toggle
(function() {
  console.log('Menu script loaded');
  const menuToggle = document.getElementById("menu-toggle");
  const menuClose = document.getElementById("menu-close");
  const sidebar = document.getElementById("toggle-sidebar");
  const body = document.body;

  console.log('Menu elements:', { menuToggle, menuClose, sidebar });

  if (menuToggle && sidebar) {
    console.log('Setting up menu event listeners');

    // Open menu
    menuToggle.addEventListener("click", function() {
      console.log('Menu toggle clicked - opening sidebar');
      sidebar.classList.add("active");
      body.classList.add("menu-open");
    });

    // Close menu
    if (menuClose) {
      menuClose.addEventListener("click", function() {
        console.log('Close button clicked - closing sidebar');
        sidebar.classList.remove("active");
        body.classList.remove("menu-open");
      });
    }

    // Close on outside click
    sidebar.addEventListener("click", function(e) {
      if (e.target === sidebar) {
        console.log('Clicked outside menu - closing sidebar');
        sidebar.classList.remove("active");
        body.classList.remove("menu-open");
      }
    });
  } else {
    console.error('Menu elements not found!');
  }
})();
</script>
